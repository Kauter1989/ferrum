# Python lint and format rules for FERRUM's bridges, scripts and Claude Code hooks.
# Applied by the post-edit hook (F) to every edited Python file, by the pre-push
# hook (E) and by the CI job `python-lint` to the Python files a branch changes.
# Older files are brought in line when they are next touched (docs/quality.md).
line-length = 120
target-version = "py310"

[lint]
select = [
  "E", "W", "F",   # pycodestyle, pyflakes
  "I",             # import order
  "B",             # bugbear
  "UP",            # pyupgrade
  "S",             # bandit: security
  "SIM",           # simplifications
  "RUF",           # ruff-specific
]

[lint.per-file-ignores]
"**/tests/**" = ["S101"]
"**/test_*.py" = ["S101"]
# Hooks and workflow scripts run git, cargo and ruff by name on purpose.
".claude/**" = ["S603", "S607"]
