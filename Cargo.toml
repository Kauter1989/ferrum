[workspace]
resolver = "2"
default-members = ["crates/ferrum"]
members = [
    "crates/ferrum-domain",
    "crates/ferrum-processing",
    "crates/ferrum-io",
    "crates/ferrum-render",
    "crates/ferrum-app",
    "crates/ferrum",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "MIT"
authors = ["FERRUM contributors"]
repository = "https://github.com/Kauter1989/ferrum"

[workspace.dependencies]
ferrum-domain = { path = "crates/ferrum-domain" }
ferrum-processing = { path = "crates/ferrum-processing" }
ferrum-io = { path = "crates/ferrum-io" }
ferrum-render = { path = "crates/ferrum-render", default-features = false }
ferrum-app = { path = "crates/ferrum-app" }

glam = { version = "0.33", features = ["bytemuck"] }
rayon = "1.10"
thiserror = "2"
bytemuck = { version = "1", features = ["derive"] }
half = { version = "2", features = ["bytemuck"] }
log = "0.4"
env_logger = "0.11"
pollster = "0.4"
naga = { version = "30", features = ["wgsl-in"] }
wgpu = "30"
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
egui = "0.36"
egui-wgpu = "0.36"
egui_kittest = { version = "0.36", features = ["wgpu"] }
rfd = "0.17"
image = { version = "0.25", default-features = false, features = ["png"] }
dicom-object = "0.10"
dicom-pixeldata = { version = "0.10", features = ["openjp2"] }
dicom-dictionary-std = "0.10"
dicom-core = "0.10"
proptest = "1"
criterion = { version = "0.5", default-features = false }
approx = "0.5"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3

[profile.dev.package."*"]
opt-level = 2

[profile.test]
opt-level = 1

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
field_reassign_with_default = "allow"
cognitive_complexity = "warn"
too_many_lines = "warn"
excessive_nesting = "warn"
