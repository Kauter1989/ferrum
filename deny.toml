# cargo-deny: licences of every dependency must be compatible with
# FERRUM's "MIT OR Apache-2.0" and with embedding in commercial products.
# Run with `cargo deny check licenses` (CI job `licenses`).

[graph]
all-features = true

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "IJG",
    "ISC",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "0BSD",
]

[licenses.private]
ignore = true
