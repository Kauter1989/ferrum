[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ferrum-bridges"
version = "0.2.0"
description = "Bridges serving segmentation engines (nnInteractive, TotalSegmentator, MONAI Label) over the FERRUM Engine Protocol (ferrum-engine/1)"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "numpy"]

[project.optional-dependencies]
# Each engine is optional and installs its own stack (PyTorch etc.).
# nnInteractive: code Apache-2.0, weights CC BY-NC-SA 4.0.
nninteractive = ["nninteractive>=2.6,<3"]
# TotalSegmentator: code Apache-2.0; some tasks need a licence.
totalsegmentator = ["TotalSegmentator>=2.18,<3", "nibabel"]
test = ["pytest", "httpx", "nibabel"]

[project.scripts]
ferrum-bridge = "ferrum_bridges.__main__:main"

[tool.setuptools]
packages = ["ferrum_bridges"]
