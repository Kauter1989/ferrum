[package]
name = "ferrum"
description = "FERRUM. High-performance medical imaging: 2D slices, MPR and GPU volume rendering of DICOM and NIfTI data."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
default-run = "ferrum"

[[bin]]
name = "ferrum"
path = "src/main.rs"

[lib]
name = "ferrum"
path = "src/lib.rs"

[dependencies]
ferrum-domain.workspace = true
ferrum-processing.workspace = true
ferrum-io.workspace = true
ferrum-render = { workspace = true, features = ["gpu"] }
ferrum-app.workspace = true
glam.workspace = true
log.workspace = true
env_logger.workspace = true
eframe.workspace = true
egui.workspace = true
egui-wgpu.workspace = true
egui-phosphor = { version = "0.14", default-features = false, features = ["light"] }
wgpu.workspace = true
rfd.workspace = true
image.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
