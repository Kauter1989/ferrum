# Build, lint and test the workspace.
# GPU tests run on Mesa lavapipe (software Vulkan) and are mandatory.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always
  FERRUM_REQUIRE_GPU: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit, property, integration, GPU parity, UI)
        run: cargo test --workspace -- --test-threads=4
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run
      - name: Release build
        run: cargo build --release

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2
      - name: Coverage (fails below the floor set in the Makefile)
        run: make coverage-ci | tee coverage.txt
        shell: bash -o pipefail {0}
      - name: Coverage summary
        if: always()
        run: |
          echo '### Test coverage' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^(Filename|TOTAL)' coverage.txt >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: |
            lcov.info
            target/llvm-cov/html

  bridge:
    # Engine bridges: protocol tests with the model-free backend, then
    # FERRUM's conformance suite against the running bridge. The models need
    # a GPU and are not exercised in CI.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bridges
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the bridges
        run: pip install ".[test]"
      - name: Bridge tests
        run: pytest -q
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Start the bridge (fake backend)
        run: |
          ferrum-bridge --port 8765 fake > bridge.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8765/v1/info && exit 0; sleep 1; done
          cat bridge.log; exit 1
      - name: Conformance suite against the bridge
        working-directory: .
        env:
          FERRUM_ENGINE_URL: http://127.0.0.1:8765
        run: cargo test -p ferrum-engines --test conformance
      - name: DICOM SEG and SR export, validated with highdicom
        working-directory: .
        env:
          FERRUM_DICOM_EXPORT_DIR: ${{ runner.temp }}/dicom-export
        run: |
          pip install highdicom
          cargo test -p ferrum-io --test dicom_export
          python scripts/validate_dicom_export.py "$FERRUM_DICOM_EXPORT_DIR"
