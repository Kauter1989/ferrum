# Build, lint and test the workspace.
# GPU tests run on Mesa lavapipe (software Vulkan) and are mandatory.

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

env:
  CARGO_TERM_COLOR: always
  FERRUM_REQUIRE_GPU: '1'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install software Vulkan (lavapipe)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends mesa-vulkan-drivers libvulkan1
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Tests (unit, property, integration, GPU parity, UI)
        run: cargo test --workspace -- --test-threads=4
      - name: Benchmarks compile
        run: cargo bench --workspace --no-run
      - name: Release build
        run: cargo build --release
