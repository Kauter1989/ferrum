# Builds release archives (the ferrum viewer, the ferrum-cli agent tool,
# the agent skill package and a plugin folder) and publishes them as a
# GitHub release.
#
# Two ways to release:
# - push a `v*` tag, or
# - run the workflow manually (Actions → Release → Run workflow) with the
#   `tag` input, e.g. `v0.2.0`: the tag is created on the selected branch's
#   head together with the release.
# A manual run with an empty `tag` is a dry run: archives are built and kept
# as workflow artifacts, nothing is published.

name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to create and publish (e.g. v0.2.0). Empty = dry run.'
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked -p ferrum -p ferrum-cli --target ${{ matrix.target }}
      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: |
          name=ferrum-${TAG}-${{ matrix.target }}
          bin=target/${{ matrix.target }}/release
          mkdir -p "$name/skills" "$name/ferrum-plugin/.claude-plugin" "$name/ferrum-plugin/skills" "$name/ferrum-plugin/bin"
          cp "$bin/ferrum" "$bin/ferrum-cli" README.md LICENSE "$name"/
          cp -R skills/ferrum "$name/skills/"
          cp -R skills/ferrum "$name/ferrum-plugin/skills/"
          cp skills/plugin/plugin.json "$name/ferrum-plugin/.claude-plugin/plugin.json"
          sed 's/__EXE__//' skills/plugin/mcp.json > "$name/ferrum-plugin/.mcp.json"
          cp "$bin/ferrum-cli" "$name/ferrum-plugin/bin/"
          tar czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          $name = "ferrum-$env:TAG-${{ matrix.target }}"
          $bin = "target/${{ matrix.target }}/release"
          $plugin = "$name/ferrum-plugin"
          New-Item -ItemType Directory $name, "$name/skills", "$plugin/.claude-plugin", "$plugin/skills", "$plugin/bin" -Force | Out-Null
          Copy-Item "$bin/ferrum.exe", "$bin/ferrum-cli.exe", README.md, LICENSE $name
          Copy-Item -Recurse skills/ferrum "$name/skills/"
          Copy-Item -Recurse skills/ferrum "$plugin/skills/"
          Copy-Item skills/plugin/plugin.json "$plugin/.claude-plugin/plugin.json"
          (Get-Content skills/plugin/mcp.json) -replace '__EXE__', '.exe' | Set-Content "$plugin/.mcp.json"
          Copy-Item "$bin/ferrum-cli.exe" "$plugin/bin/"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
          "ASSET=$name.zip" | Out-File -FilePath $env:GITHUB_ENV -Append
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish the release (creates the tag if needed)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: FERRUM ${{ env.TAG }}
          generate_release_notes: true
          files: dist/*
